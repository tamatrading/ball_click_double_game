<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カラフルボールわりゲーム</title>
    <!-- ページ下部の運営者表記（2026-09-18 追加）。ゲーム本体は #root の中にあり
         min-h-screen（画面の高さいっぱい）なので、フッターぶんの高さを差し引いて
         余計なスクロールが出ないようにしている -->
    <style>
      .site-foot{height:24px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:11px;color:#64748b;background:#fff;border-top:1px solid #e2e8f0}
      #root>*{min-height:calc(100vh - 24px)!important}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <footer class="site-foot">運営：まなびタイム事務局（代表 Makoto Takeuchi）／&copy; 2026 ManabiTime</footer>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
